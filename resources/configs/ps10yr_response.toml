# IceCube 10-year point-source sample detector response
#
# Both the effective area and the joint smearing (P(E_reco, PSF, AngErr | E_true, dec))
# are read from the data-release IRF CSV files.  Multiple seasons are averaged
# uniformly.  Seasons without a dedicated IRF file (IC86_III–VII) fall back to
# the IC86_II files automatically.

[meta]
name   = "IceCube 10-year PS sample"
sample = "PS10yr"

# ---------------------------------------------------------------------------
# Track morphology (muon neutrinos via charged-current interactions)
# ---------------------------------------------------------------------------

[track.effective_area]
type    = "dataverse_csv"
irf_dir = "/Users/jlazar/Downloads/dataverse_files 2/irfs"
seasons = [
    "IC86_I",
    "IC86_II",
    "IC86_III",
    "IC86_IV",
    "IC86_V",
    "IC86_VI",
    "IC86_VII",
]

[track.smearing]
type    = "dataverse_csv"
irf_dir = "/Users/jlazar/Downloads/dataverse_files 2/irfs"
seasons = [
    "IC86_I",
    "IC86_II",
    "IC86_III",
    "IC86_IV",
    "IC86_V",
    "IC86_VI",
    "IC86_VII",
]
