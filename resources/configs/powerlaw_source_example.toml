# Example point source with a power-law neutrino flux.
#
# Load with:
#   src = PointSource.from_toml("resources/configs/powerlaw_source_example.toml")
#
# Flux convention
# ---------------
# norm is the per-species flux at the pivot energy [GeV^-1 cm^-2 s^-1].
# The track event sampler sums NuMu + NuMuBar, so the total nu+nubar
# track flux at the pivot = 2 * norm.
#
# Example: total (nu+nubar) flux = 5e-11 TeV^-1 cm^-2 s^-1 at 1 TeV
#          = 5e-14 GeV^-1 cm^-2 s^-1  →  norm = 2.5e-14

[location]
right_ascension = 50.0   # degrees
declination     =  5.0   # degrees

[flux]
norm_per_species = 1e-18    # GeV^-1 cm^-2 s^-1 per species at the pivot energy
gamma = 2.0
pivot = 1e5      # GeV
emin  = 1e2      # GeV  (match sampler grid lower edge)
emax  = 1e6      # GeV
